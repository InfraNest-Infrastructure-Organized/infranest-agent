name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to a full commit SHA, never a tag. A tag is a moving pointer the action's owner can
# repoint at any time, and a compromised popular action is how CI supply-chain attacks have actually
# happened. The trailing comment records which release each SHA was, so upgrades stay legible.
#
# Least privilege: nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  build:
    name: Build, test and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go test -race ./...

      # Every target, every commit. Most of this agent is platform-specific by construction, so a
      # Linux-only build would let a Windows or ARM break sit undiscovered until someone tried to install
      # it — and the person who discovers it that way is a customer.
      #
      # CGO_ENABLED=0 is the portability guarantee, not an optimisation: it produces a static binary with
      # no libc, so one Linux build runs on glibc and musl alike. Without it, an Alpine host needs a
      # different artefact.
      - name: Build every target
        env:
          CGO_ENABLED: "0"
        run: |
          for target in \
            linux/amd64 linux/arm64 linux/arm linux/386 linux/riscv64 linux/ppc64le linux/s390x \
            windows/amd64 windows/arm64 \
            darwin/amd64 darwin/arm64 freebsd/amd64; do
            os=${target%/*}; arch=${target#*/}
            GOOS=$os GOARCH=$arch go build -o /dev/null ./... || { echo "::error::build failed for $target"; exit 1; }
            echo "  ok  $target"
          done

      # `go vet` only inspects the platform it runs on, so the Windows syscall code would otherwise never
      # be examined at all.
      - name: Vet the other platforms
        run: |
          for os in windows darwin freebsd; do
            GOOS=$os go vet ./... || { echo "::error::vet failed for $os"; exit 1; }
          done

  installer-sources:
    name: The installer reaches a release by either route
    runs-on: ubuntu-latest
    # Wider than the workflow's default for one reason: the attestation check below needs a bundle that is
    # genuinely signed and still not ours to accept, and the only way to have one is for this workflow to
    # sign it. `id-token` gets the short-lived certificate; `attestations` is where the action records it.
    # Nothing in this job writes to the repository.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # install.sh downloads from get.infranest.io first and GitHub second (#1791): GitHub has no IPv6
      # address, and some networks allow only github.com. A fallback nobody exercises is a fallback that
      # has quietly stopped working, so each route is taken for real here, with the other one blackholed
      # (192.0.2.1 is TEST-NET-1: routed nowhere, so the connection times out exactly as a blocked host
      # does). It installs the current published release, so a red run here is either this script or
      # the release — both worth knowing.
      #
      # Real installs in a throwaway container, not a lifted snippet: the property is "an install
      # completes", and only an install can show it.
      - name: Install with each source blocked in turn, and a pinned version
        run: |
          run() {
            label="$1"; shift
            echo "── $label"
            out=$(docker run --rm -v "$PWD/install.sh:/install.sh:ro" "$@" debian:stable-slim sh -c '
              apt-get update -qq >/dev/null && apt-get install -y -qq curl ca-certificates >/dev/null &&
              sh /install.sh --token sat_ci $VERSION_ARG && test -x /usr/local/bin/infranest-agent' 2>&1) \
              || { echo "$out"; echo "::error::install failed: $label"; exit 1; }
            echo "$out" | grep -E '^  (release|!)' || true
          }
          run "both reachable"
          run "get.infranest.io blocked" --add-host get.infranest.io:192.0.2.1
          run "github.com blocked" --add-host github.com:192.0.2.1 \
            --add-host release-assets.githubusercontent.com:192.0.2.1
          run "pinned version, get.infranest.io blocked" --add-host get.infranest.io:192.0.2.1 \
            -e VERSION_ARG="--version v0.9.0"

      # `--upgrade` exists to keep two promises a re-install cannot (InfraNest#2459): it needs no token,
      # because InfraNest shows one once and most people no longer have it, and it leaves agent.conf
      # alone, because a re-install rewrites it from the template and quietly turns off whatever was
      # turned on since. Both are asserted on a file that was edited by hand after the install, which is
      # the case that matters — an untouched file survives a rewrite looking the same.
      #
      # The refusals matter as much: with nothing installed there is no configuration to keep, and an
      # option that would change one must fail rather than be accepted and ignored.
      - name: --upgrade replaces the binary and leaves the configuration alone
        run: |
          out=$(docker run --rm -v "$PWD/install.sh:/install.sh:ro" debian:stable-slim sh -c '
            set -e
            apt-get update -qq >/dev/null && apt-get install -y -qq curl ca-certificates >/dev/null
            conf=/etc/infranest/agent.conf

            if sh /install.sh --upgrade >/dev/null 2>&1; then
              echo "FAIL: --upgrade succeeded with no agent installed"; exit 1
            fi

            sh /install.sh --token sat_ci --processes --version v0.9.1 >/dev/null 2>&1
            echo "INFRANEST_INTERVAL=30s" >> "$conf"
            before=$(sha256sum "$conf"); mode=$(stat -c "%a %U" "$conf")
            old=$(/usr/local/bin/infranest-agent --version)

            for refused in "--token sat_other" "--processes" "--url https://example.test"; do
              if sh /install.sh --upgrade $refused >/dev/null 2>&1; then
                echo "FAIL: --upgrade accepted $refused"; exit 1
              fi
            done
            [ "$(sha256sum "$conf")" = "$before" ] || { echo "FAIL: a refused upgrade changed agent.conf"; exit 1; }

            sh /install.sh --upgrade >/dev/null 2>&1 || { echo "FAIL: --upgrade did not complete"; exit 1; }

            [ "$(sha256sum "$conf")" = "$before" ] || { echo "FAIL: --upgrade changed agent.conf"; exit 1; }
            [ "$(stat -c "%a %U" "$conf")" = "$mode" ] || { echo "FAIL: --upgrade changed who can read agent.conf"; exit 1; }
            new=$(/usr/local/bin/infranest-agent --version)
            [ "$new" != "$old" ] || { echo "FAIL: the binary is still $old"; exit 1; }
            echo "$old -> $new"' 2>&1) \
            || { echo "$out"; echo "::error::--upgrade does not keep its promises"; exit 1; }
          echo "$out" | tail -1

      # The build-attestation check (InfraNest#2361), end to end: the real installer, a real release's
      # binary and its real attestation, served from a stand-in download host so the one thing CI cannot
      # get from a genuine release — a binary that is NOT ours, with a checksum that matches it — can be
      # served too. The tampered case is the whole point: the checksum alone installs it happily.
      #
      # v0.9.1 predates the attestation being published as a release asset, so its bundle is read from
      # GitHub's attestation API here, which is the same bundle byte for byte.
      #
      # The pin, tried rather than read (InfraNest#2361). The tampered case has no attestation for its
      # bytes at all, so it would be refused by an installer that accepted *any* signature. What the pin
      # is for is a binary that IS properly attested, by a workflow that is not release.yml: any workflow
      # in this repository can obtain a certificate, and only one of them builds releases. So this one
      # signs a binary here, with the same action release.yml uses, and the installer has to refuse it.
      # Signed, not just built: the bytes are a real release binary with a marker appended, so they run
      # and have a digest of their own, and no attestation for a real release is ever made by ci.yml.
      #
      # A pull request from a fork gets no id-token, so it cannot sign and these cases are skipped there,
      # with a notice. Every other run exercises them.
      - name: Make a binary, signed by this workflow
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir -p foreign
          curl -fsSL -o foreign/infranest-agent_linux_amd64 \
            https://github.com/InfraNest-Infrastructure-Organized/infranest-agent/releases/download/v0.9.1/infranest-agent_linux_amd64
          printf 'signed by ci.yml' >> foreign/infranest-agent_linux_amd64

      - name: Sign it with the action release.yml uses
        id: foreign
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: foreign/infranest-agent_linux_amd64

      - name: A binary we did not build is refused when gh or cosign can check it
        env:
          GH_TOKEN: ${{ github.token }}
          FOREIGN_BUNDLE: ${{ steps.foreign.outputs.bundle-path }}
        run: |
          set -eu
          R=InfraNest-Infrastructure-Organized/infranest-agent
          V=v0.9.1
          A=infranest-agent_linux_amd64
          for tree in genuine tampered; do
            d="fixtures/$tree/releases/download/$V"; mkdir -p "$d"
            curl -fsSL -o "$d/$A" "https://github.com/$R/releases/download/$V/$A"
          done
          printf 'x' >> "fixtures/tampered/releases/download/$V/$A"
          digest=$(sha256sum "fixtures/genuine/releases/download/$V/$A" | cut -d' ' -f1)
          gh api "repos/$R/attestations/sha256:$digest" --jq '.attestations[0].bundle' > bundle.json
          for tree in genuine tampered; do
            d="fixtures/$tree/releases/download/$V"
            (cd "$d" && sha256sum "$A" > "$A.sha256")
            cp bundle.json "$d/infranest-agent.sigstore.json"
          done
          sed 's#^SOURCES=.*#SOURCES="http://127.0.0.1:8765"#' install.sh > fixtures/install.sh
          grep -q '^SOURCES="http://127.0.0.1:8765"$' fixtures/install.sh || { echo "::error::could not repoint SOURCES"; exit 1; }

          check() {
            label="$1" tree="$2" tool="$3" want="$4" script="${5:-install.sh}"
            got=$(docker run --rm -v "$PWD/fixtures:/f:ro" -v "$(command -v gh):/host-gh:ro" debian:stable-slim sh -c "
              apt-get update -qq >/dev/null && apt-get install -y -qq curl ca-certificates python3 >/dev/null
              mkdir -p /tools
              case $tool in
                gh)     cp /host-gh /tools/gh ;;
                cosign) curl -fsSL -o /tools/cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 && chmod +x /tools/cosign ;;
              esac
              export PATH=/tools:\$PATH
              (cd /f/$tree && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &) ; sleep 1
              sh /f/$script --token sat_ci --version $V >/tmp/out 2>&1 || true
              grep -E '^  (verif|built|build)|^error' /tmp/out
              test -x /usr/local/bin/infranest-agent && echo INSTALLED || echo REFUSED")
            echo "── $label"; echo "$got"
            echo "$got" | tail -1 | grep -qx "$want" || { echo "::error::$label: expected $want"; exit 1; }
            # A refusal has to be the attestation's doing. Anything else that stops an install — a download
            # that failed, a missing file — also ends in REFUSED, and would pass here for the wrong reason.
            if [ "$want" = REFUSED ] && [ "$tree" = foreign ]; then
              echo "$got" | grep -q 'does not verify' || { echo "::error::$label: refused, but not by the attestation check"; exit 1; }
            fi
          }
          check "genuine, gh"          genuine  gh     INSTALLED
          check "genuine, cosign"      genuine  cosign INSTALLED
          check "tampered, gh"         tampered gh     REFUSED
          check "tampered, cosign"     tampered cosign REFUSED
          check "genuine, no verifier" genuine  none   INSTALLED

          if [ -z "${FOREIGN_BUNDLE:-}" ]; then
            echo "::notice::the signed-by-another-workflow cases were skipped: a fork's pull request cannot sign"
            exit 0
          fi
          d="fixtures/foreign/releases/download/$V"; mkdir -p "$d"
          cp "foreign/$A" "$d/$A"
          (cd "$d" && sha256sum "$A" > "$A.sha256")
          cp "$FOREIGN_BUNDLE" "$d/infranest-agent.sigstore.json"

          # The control. The same installer, pinned to ci.yml instead of release.yml, must ACCEPT this
          # bundle — otherwise the refusals below could be the bundle being unreadable, or not matching the
          # binary, rather than the pin. Only the two pin lines differ from the installer under test.
          sed -e 's#^WORKFLOW=.*#WORKFLOW="${REPO}/.github/workflows/ci.yml"#' \
              -e 's#^IDENTITY_RE=.*#IDENTITY_RE="^https://github\\.com/${REPO}/\\.github/workflows/ci\\.yml@"#' \
              fixtures/install.sh > fixtures/install-pinned-to-ci.sh
          [ "$(diff fixtures/install.sh fixtures/install-pinned-to-ci.sh | grep -c '^>')" -eq 2 ] \
            || { echo "::error::could not repoint the pin for the control"; diff fixtures/install.sh fixtures/install-pinned-to-ci.sh; exit 1; }

          check "signed by ci.yml, gh"                    foreign gh     REFUSED
          check "signed by ci.yml, cosign"                foreign cosign REFUSED
          check "control: pinned to ci.yml instead, gh"     foreign gh     INSTALLED install-pinned-to-ci.sh
          check "control: pinned to ci.yml instead, cosign" foreign cosign INSTALLED install-pinned-to-ci.sh

  invariant:
    name: It only sends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # The promise in the README, checked rather than asserted. The agent must not be able to run a
      # subprocess or accept an inbound connection — so the packages that would let it must not appear
      # anywhere in the binary's dependency graph, transitively included.
      #
      # This is a build-graph check rather than a grep: an indirect import through a helper package would
      # slip past a grep of our own source, and that is exactly how an invariant erodes.
      # Per platform, not just the host's. `go list -deps` resolves build tags for one GOOS, so a check
      # that runs only on Linux never looks at the //go:build windows file at all — `os/exec` could sit in
      # it and this job would still be green. The guarantee is per-binary, so the check has to be too.
      - name: The agent cannot execute anything, or listen
        run: |
          fail=0
          for os in linux windows darwin freebsd; do
            deps=$(GOOS=$os go list -deps ./cmd/infranest-agent)
            for pkg in os/exec net/rpc net/http/cgi net/http/fcgi; do
              if echo "$deps" | grep -qx "$pkg"; then
                echo "::error::$pkg is in the $os dependency graph. The agent only sends: it runs nothing and serves nothing."
                fail=1
              fi
            done
          done
          exit $fail

      # The installer writes the systemd unit itself, because the version it used to fetch was the one
      # file it did not verify — and its fallback read from the current directory, which under
      # `curl | sh` is wherever the admin happened to be standing. Embedding removes that, and this is
      # what stops the embedded copy drifting from the one people read in the repository.
      - name: The unit the installer writes is the unit in packaging/
        run: |
          sed -n '/<<.INFRANEST_UNIT_EOF./,/^INFRANEST_UNIT_EOF$/p' install.sh \
            | sed '1d;$d' > /tmp/embedded.service
          if ! diff -u packaging/infranest-agent.service /tmp/embedded.service; then
            echo "::error::install.sh embeds a different unit than packaging/infranest-agent.service."
            exit 1
          fi
          # A unit with no User= runs as root. Cheap to assert, and the whole point of the file.
          grep -qx 'User=infranest-agent' /tmp/embedded.service \
            || { echo "::error::the embedded unit has no User= line"; exit 1; }
          grep -qx 'NoNewPrivileges=yes' /tmp/embedded.service \
            || { echo "::error::the embedded unit lost NoNewPrivileges"; exit 1; }

      # The advice the installer prints has to be runnable, and under `curl | sh` — the documented way to
      # install — `$0` is `sh`, so anything built from it reads `sh sh`. That shipped in v0.9.0: the closing
      # hint told people to run `sudo sh sh --uninstall`. Nothing failed; the reader was simply handed
      # something that is not a command, which is the kind of bug only a real install finds.
      #
      # Rendered rather than grepped: `sudo sh $0` is correct when the script *is* a file, so its presence
      # proves nothing either way. What matters is what each caller is told.
      - name: The installer's advice works whether it was piped or run as a file
        run: |
          # Everything the installer prints as advice, rendered the way a piped install sees it: `$0` is `sh`.
          # Lifted out of install.sh rather than restated, so the check cannot pass while the installer is wrong.
          helper=$(sed -n '/^invoked_as_a_file() /p' install.sh)
          [ -n "$helper" ] || { echo "::error::install.sh has no invoked_as_a_file helper"; exit 1; }

          hint=$(sed -n '/^echo "Remove it completely:"$/,/infranest-agent uninstall/p' install.sh)
          [ -n "$hint" ] || { echo "::error::could not find the uninstall hint"; exit 1; }

          out=$(printf 'BIN_DIR=/usr/local/bin\n%s\n%s\n' "$helper" "$hint" | sh -s)

          # The symptom, exactly: `$0` is `sh` under a pipe, so anything built from it reads `sh sh`.
          case "$out" in
            *"sh sh"*) echo "::error::the uninstall hint prints 'sh sh' under a pipe:"; echo "$out"; exit 1 ;;
          esac
          # And it must still name something that exists on the machine.
          case "$out" in
            *"/usr/local/bin/infranest-agent uninstall"*) ;;
            *) echo "::error::piped, the hint should point at the installed binary:"; echo "$out"; exit 1 ;;
          esac

          # Run as a file, the one-command path is kept.
          printf 'BIN_DIR=/usr/local/bin\n%s\n%s\n' "$helper" "$hint" > /tmp/hintfile.sh
          file_out=$(sh /tmp/hintfile.sh)
          case "$file_out" in
            *"--uninstall"*) ;;
            *) echo "::error::run as a file, the hint should offer the installer's own --uninstall:"; echo "$file_out"; exit 1 ;;
          esac

          # The root message has the same trap, and it is the first thing a non-root reader sees. Rendered rather
          # than grepped: `sudo sh $0` is correct when the script is a file, so its presence proves nothing either
          # way — what matters is what a piped reader is told.
          root=$(sed -n '/^if \[ "\$(id -u)" -ne 0 \]; then$/,/^fi$/p' install.sh)
          [ -n "$root" ] || { echo "::error::could not find the root check"; exit 1; }

          root_out=$(printf '%s\nid() { echo 1; }\ndie() { printf "%%s\\n" "$*"; }\n%s\n' "$helper" "$root" | sh -s)
          case "$root_out" in
            *"sh sh"*) echo "::error::the root message prints 'sh sh' under a pipe:"; echo "$root_out"; exit 1 ;;
          esac
          [ -n "$root_out" ] || { echo "::error::the root check said nothing"; exit 1; }

          echo "the installer's advice is runnable whether it was piped or run as a file"

      # `--processes` decides what leaves a customer's machine, so both directions are asserted: asked for,
      # it must actually be written; not asked for, it must stay commented out. Neither is visible until
      # somebody installs an agent and looks at what arrived, which is far too late to notice.
      #
      # The branch and the template are lifted out of install.sh rather than restated here — a check that
      # repeats the logic it is checking passes when the installer is wrong.
      - name: --processes writes the setting, and only when asked
        run: |
          decision=$(sed -n '/^if \[ "\$PROCESSES" -eq 1 \]; then$/,/^fi$/p' install.sh)
          [ -n "$decision" ] || { echo "::error::could not find the PROCESSES branch in install.sh"; exit 1; }

          tmpl=$(sed -n '/^cat > "${CONF_DIR}\/agent.conf" <<CONF$/,/^CONF$/p' install.sh | sed '1d;$d')
          [ -n "$tmpl" ] || { echo "::error::could not find the agent.conf template in install.sh"; exit 1; }

          render() {
            PROCESSES=$1
            eval "$decision"
            TOKEN=sat_test API_URL=https://example.test USER_NAME=infranest-agent
            eval "cat <<CONF
          $tmpl
          CONF"
          }

          echo "$(render 0)" | grep -qx '#INFRANEST_PROCESSES=1' \
            || { echo "::error::without --processes the setting must stay commented out"; exit 1; }
          echo "$(render 1)" | grep -qx 'INFRANEST_PROCESSES=1' \
            || { echo "::error::--processes must write INFRANEST_PROCESSES=1"; exit 1; }
          # Command lines are a second, separate decision — one flag must never grant both.
          echo "$(render 1)" | grep -qx '#INFRANEST_PROCESS_ARGS=1' \
            || { echo "::error::--processes must not also turn on INFRANEST_PROCESS_ARGS"; exit 1; }

          sh install.sh --help | grep -q -- '--processes' \
            || { echo "::error::--processes is not documented in --help"; exit 1; }
          # And that it is actually *accepted*: the render above sets the variable directly, so deleting
          # the option from the parser leaves every other assertion here passing while the flag dies with
          # "unknown option". `--help` exits inside the parse loop, before the root check.
          sh install.sh --processes --help >/dev/null 2>&1 \
            || { echo "::error::install.sh does not accept --processes"; exit 1; }

      # `net` and `net/http` are legitimately needed to *make* a request, so their presence proves nothing
      # either way. What must never appear is the act of binding a socket.
      - name: The agent opens no listening socket
        run: |
          if grep -rnE '\b(net\.Listen|net\.ListenPacket|http\.ListenAndServe|http\.Serve|\.Accept\()' \
               --include='*.go' . ; then
            echo "::error::Something here binds or accepts on a socket. The agent exposes no local interface."
            exit 1
          fi

      # The agent reads systemd's state and cannot change it (#774). The operating system already refuses
      # — unit control is gated behind polkit and this service has no session to authenticate with — so
      # this check is not the security boundary. It is here for the same reason the os/exec one is: to
      # keep a deliberate restraint from eroding one convenient-looking commit at a time, and to make the
      # claim in the README something a reader can verify rather than take on trust.
      - name: The agent can read systemd, and cannot command it
        run: |
          if grep -rnE '"(StartUnit|StopUnit|RestartUnit|ReloadUnit|KillUnit|TryRestartUnit|ReloadOrRestartUnit|EnableUnitFiles|DisableUnitFiles|MaskUnitFiles|SetUnitProperties|Reexecute)"' \
               --include='*.go' . ; then
            echo "::error::A unit-control method name is in the source. The agent only reads systemd's state."
            exit 1
          fi

      # Dependencies are the other supply chain. There should be none.
      - name: No third-party dependencies
        run: |
          if [ -s go.sum ]; then
            echo "::error::go.sum is not empty — a third-party dependency was added. See CONTRIBUTING.md."
            exit 1
          fi
          # Go's own answer, not a guess at one. `.Standard` is the toolchain's field for "this is the
          # standard library", so this cannot disagree with the compiler about what counts.
          #
          # It used to be `grep -E '\.'` — a dot makes a path a domain, so "has no dot" looked like it
          # separated the standard library from everything else. It does not: the standard library
          # vendors parts of golang.org/x into itself, so `vendor/golang.org/x/net/http2/hpack` is
          # stdlib with a dot in its name. That never came up while the agent imported nothing that
          # reached crypto/tls, and the first HTTPS client turned this job red for a dependency nobody
          # had added. A gate that fails on correct code gets switched off, which is the real cost.
          for os in linux windows darwin freebsd; do
            outside=$(GOOS=$os go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./... \
              | grep -vE '^github\.com/InfraNest-Infrastructure-Organized/infranest-agent(/.*)?$' || true)
            if [ -n "$outside" ]; then
              echo "::error::A package outside the standard library is in the $os graph: $outside. See CONTRIBUTING.md."
              exit 1
            fi
          done
